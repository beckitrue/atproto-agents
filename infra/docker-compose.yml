# The whole server-side stack: PDS + game engine + OpenFGA + Caddy.
# Runs identically on the demo EC2 box and on your own machine/server.
#
#   cp .env.example .env   # fill in secrets
#   docker compose up -d
#
# On first boot, fga-init creates the OpenFGA store and writes the auth model
# automatically. FGA_STORE_ID and FGA_MODEL_ID are populated from .env if set,
# or sourced from /fga-config/fga.env written by fga-init.
#
# DNS (Cloudflare, DNS-only for the apex handles you add):
#   pds.<domain>            A  <server IP>   — the PDS
#   game.<domain>           A  <server IP>   — game engine API
#   observer.<domain>       A  <server IP>   — public audience view
#   <agent>.<domain>        A  <server IP>   — one per agent handle
services:
  caddy:
    # Built, not pulled: the image carries the observer's static build.
    build:
      context: ..
      dockerfile: infra/caddy.Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}

  pds:
    image: ghcr.io/bluesky-social/pds:latest
    restart: unless-stopped
    volumes:
      - pds_data:/pds
    environment:
      - PDS_HOSTNAME=pds.${DOMAIN}
      # agent handles live directly under the apex domain (red-spymaster.<domain>)
      - PDS_SERVICE_HANDLE_DOMAINS=.${DOMAIN}
      - PDS_ADMIN_PASSWORD=${PDS_ADMIN_PASSWORD}
      - PDS_JWT_SECRET=${PDS_JWT_SECRET}
      - PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX=${PDS_PLC_ROTATION_KEY_K256_PRIVATE_KEY_HEX}
      - PDS_DATA_DIRECTORY=/pds
      - PDS_BLOBSTORE_DISK_LOCATION=/pds/blocks
      - PDS_DID_PLC_URL=${PDS_DID_PLC_URL:-https://plc.directory}
      - PDS_BSKY_APP_VIEW_URL=https://api.bsky.app
      - PDS_BSKY_APP_VIEW_DID=did:web:api.bsky.app
      - PDS_REPORT_SERVICE_URL=https://mod.bsky.app
      - PDS_REPORT_SERVICE_DID=did:plc:ar7c4by46qjdydhdevvrndac
      - PDS_CRAWLERS=https://bsky.network
      - LOG_ENABLED=true

  # --- OpenFGA authorization layer ---

  fga-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fga
      POSTGRES_PASSWORD: fga
      POSTGRES_DB: fga
    volumes:
      - fga_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fga"]
      interval: 5s
      timeout: 5s
      retries: 10

  fga-migrate:
    image: openfga/openfga:latest
    command: migrate
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://fga:fga@fga-db:5432/fga
    depends_on:
      fga-db:
        condition: service_healthy
    restart: on-failure

  fga:
    image: openfga/openfga:latest
    command: run
    restart: unless-stopped
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://fga:fga@fga-db:5432/fga
    depends_on:
      fga-migrate:
        condition: service_completed_successfully
    # Not exposed outside the compose network — engine talks to fga:8080 internally

  fga-init:
    image: node:22-slim
    command: node /bootstrap/bootstrap.mjs
    volumes:
      - ./fga:/bootstrap:ro
      - fga_config:/fga-config
    environment:
      - FGA_API_URL=http://fga:8080
    depends_on:
      fga:
        condition: service_started
    restart: on-failure

  engine:
    build:
      context: ..
      dockerfile: infra/engine.Dockerfile
    restart: unless-stopped
    volumes:
      - fga_config:/fga-config:ro
    environment:
      - PORT=8080
      # Service auth: the audience agents mint for (the referee DID). Verification
      # is DID resolution — no IdP, no shared secret. PLC_DIRECTORY_URL is unset
      # here (defaults to plc.directory); set it to a local dev PLC for offline
      # runs — see docs/HOW-TO-RUN-LOCALLY.md.
      - ENGINE_DID=${ENGINE_DID:-did:plc:xgdzu5egqclsjtiwiv7rkf2k}
      - PLC_DIRECTORY_URL=${PLC_DIRECTORY_URL:-}
      - FGA_API_URL=http://fga:8080
      # Set these in .env to pin specific IDs; otherwise fga-init auto-populates them.
      - FGA_STORE_ID=${FGA_STORE_ID:-}
      - FGA_MODEL_ID=${FGA_MODEL_ID:-}
      # The referee's PDS identity. Publishing is gated on the password being
      # present (see packages/engine/src/index.ts) and degrades silently when
      # it isn't — so omitting these costs the audit trail without an error.
      # Handle and service URL are derived from DOMAIN.
      - DOMAIN=${DOMAIN}
      - REFEREE_PDS_PASSWORD=${REFEREE_PDS_PASSWORD}
    depends_on:
      fga-init:
        condition: service_completed_successfully

volumes:
  caddy_data:
  caddy_config:
  pds_data:
  fga_db_data:
  fga_config:
